<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Portfolio QR Code Generator</h1>
        <p>Generate a QR code for your portfolio website.</p>

        <div class="qr-section">
            <input type="text" id="portfolioUrl" placeholder="Enter your portfolio URL">
            <button id="generateBtn">Generate QR Code</button>

            <div id="qrCode"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
